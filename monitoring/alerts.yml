groups:
  - name: openmythos
    rules:
      - alert: HighErrorRate
        expr: rate(openmythos_requests_total{status="error"}[5m]) / rate(openmythos_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Error rate > 5% on {{ $labels.endpoint }}"

      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(openmythos_request_latency_seconds_bucket[5m])) > 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency > 10s on {{ $labels.endpoint }}"

      - alert: ServerDown
        expr: up{job="openmythos-server"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "OpenMythos server is down"

      - alert: GPUUtilLow
        expr: openmythos_gpu_utilization_percent < 20
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "GPU utilization < 20% — possible idle serving instance"
