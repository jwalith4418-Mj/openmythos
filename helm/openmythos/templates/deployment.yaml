apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openmythos.fullname" . }}
  labels: {{ include "openmythos.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{ include "openmythos.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels: {{ include "openmythos.selectorLabels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 120
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: OPENMYTHOS_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ include "openmythos.fullname" . }}-secret
                  key: api-keys
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://jaeger-collector.monitoring.svc.cluster.local:4317"
          {{- if .Values.modelStorage.enabled }}
          volumeMounts:
            - name: models
              mountPath: {{ .Values.modelStorage.mountPath }}
              readOnly: true
          {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
      {{- if .Values.modelStorage.enabled }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ .Values.modelStorage.claimName }}
      {{- end }}
