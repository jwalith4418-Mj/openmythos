apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openmythos.fullname" . }}-secret
  labels: {{ include "openmythos.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-keys: {{ .Values.secrets.apiKeys | quote }}
  grafana-password: {{ .Values.secrets.grafanaPassword | default "changeme" | quote }}
