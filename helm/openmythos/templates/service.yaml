apiVersion: v1
kind: Service
metadata:
  name: {{ include "openmythos.fullname" . }}
  labels: {{ include "openmythos.labels" . | nindent 4 }}
  {{- if .Values.monitoring.enabled }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
  selector: {{ include "openmythos.selectorLabels" . | nindent 4 }}
