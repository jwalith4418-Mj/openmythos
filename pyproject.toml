[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-mythos"
version = "4.0.0"
description = "OpenMythos — Compute-Elastic Recurrent-Depth LLM: the same model thinks shallow on easy queries and deep on hard ones, paying only for the compute it uses."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
keywords = ["ai", "llm", "transformer", "moe", "frontier"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.3.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "prometheus-client>=0.20.0",
    "slowapi>=0.1.9",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "safetensors>=0.4.3",
]
train = [
    "datasets>=2.19.0",
    "wandb>=0.17.0",
    "pynvml>=11.5.0",
    "flash-attn>=2.5.9",
    "safetensors>=0.4.3",
]
eval = [
    "lm-eval>=0.4.3",
    "datasets>=2.19.0",
    "tiktoken>=0.7.0",
]
data = [
    "datasets>=2.19.0",
    "datasketch>=1.6.4",
    "dvc>=3.50.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "black>=24.4.2",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pip-audit>=2.7.0",
    "cyclonedx-bom>=4.4.0",
]
all = [
    "open-mythos[serve,train,eval,data,inference]",
]
inference = [
    "torch>=2.3.0",
    "numpy>=1.26",
]

[project.scripts]
openmythos-serve = "open_mythos.serving.entrypoint:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["open_mythos*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]
ignore = ["E501", "N806", "N812", "N803"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: marks tests that require HuggingFace Hub network access (deselect with -m not network)",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
ignore_missing_imports = true
